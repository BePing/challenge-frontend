<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- White background circle for trophy -->
  <circle cx="600" cy="250" r="120" fill="#ffffff" opacity="0.95"/>
  
  <!-- Trophy icon (simplified SVG version of lucide Trophy) -->
  <g transform="translate(600, 250)">
    <!-- Trophy base -->
    <rect x="-20" y="50" width="40" height="15" rx="5" fill="#0F172A"/>
    
    <!-- Trophy cup -->
    <path d="M -40 -30 L -40 50 L 40 50 L 40 -30 Z" fill="none" stroke="#0F172A" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -30 -30 Q -30 -50 0 -50 Q 30 -50 30 -30" fill="none" stroke="#0F172A" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Trophy handles -->
    <path d="M -40 -10 Q -60 -20 -60 0" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
    <path d="M 40 -10 Q 60 -20 60 0" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Top 6
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="36" fill="#CBD5E1" text-anchor="middle">
    Classements Tennis de Table
  </text>
  
  <!-- Tagline -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">
    Rankings hebdomadaires • Régions belges
  </text>
</svg>
