name: Challenge web container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'Dockerfile'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/container.yml'

permissions:
  contents: read

concurrency:
  group: challenge-web-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_HOST: ${{ vars.HETZNER_REGISTRY_HOST }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Escape Key registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.HETZNER_REGISTRY_USERNAME }}
          password: ${{ secrets.HETZNER_REGISTRY_PASSWORD }}

      - name: Build and push immutable multiarchitecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NUXT_PUBLIC_BEPING_API_BASE_URL=https://api-v2.beping.be
          tags: |
            ${{ env.REGISTRY_HOST }}/escape-key/beping-challenge-web:${{ github.sha }}
            ${{ env.REGISTRY_HOST }}/escape-key/beping-challenge-web:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=beping-challenge-web
          cache-to: type=gha,mode=max,scope=beping-challenge-web
